<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HCN Support</title>
    <meta
      name="description"
      content="Ứng dụng quản lý ticket hỗ trợ kỹ thuật phân quyền theo vai trò, theo dõi 4 trạng thái, đối soát ảnh trước/sau, thông báo thời gian thực và báo cáo thống kê tuần."
    />
    <meta property="og:title" content="HCN Support" />
    <meta
      property="og:description"
      content="Ứng dụng quản lý ticket hỗ trợ kỹ thuật phân quyền theo vai trò, theo dõi 4 trạng thái, đối soát ảnh trước/sau, thông báo thời gian thực và báo cáo thống kê tuần."
    />
    <link rel="icon" type="image/png" href="/assets/images/img_launcher_emblem.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('hcn_theme_pref_v1');
          if (!pref) {
            var legacy = localStorage.getItem('hcn_theme');
            pref = legacy === 'dark' || legacy === 'light' ? legacy : 'light';
          }
          var isDark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-orange-100 selection:text-orange-900 dark:selection:bg-orange-900/50 dark:selection:text-orange-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
